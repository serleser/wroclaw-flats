<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor mieszkań — Wrocław</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
/* =====================================================================
   System designu — bez frameworka, żeby dashboard działał też offline
   ===================================================================== */
:root{
  --bg:#f1f5f9; --panel:#ffffff; --panel-2:#f8fafc; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --brand:#2563eb; --brand-dark:#1d4ed8; --brand-soft:#dbeafe;
  --deal:#e11d48; --deal-soft:#ffe4e6;
  --owner:#059669; --owner-soft:#d1fae5;
  --warn:#d97706; --warn-soft:#fef3c7;
  --violet:#7c3aed; --violet-soft:#ede9fe;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.18);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0b1120; --panel:#111827; --panel-2:#0f172a; --border:#1e293b;
  --text:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
  --brand:#3b82f6; --brand-dark:#2563eb; --brand-soft:#1e3a5f;
  --deal:#fb7185; --deal-soft:#4c1d29;
  --owner:#34d399; --owner-soft:#064e3b;
  --warn:#fbbf24; --warn-soft:#453411;
  --violet:#a78bfa; --violet-soft:#2e1065;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ---------- nagłówek ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--panel);
  border-bottom:1px solid var(--border);
}
.hrow{max-width:1600px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:18px;flex-shrink:0}
h1{font-size:16px;margin:0;font-weight:650}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);font-size:13px}
.pill b{font-variant-numeric:tabular-nums}
.pill.deal{background:var(--deal-soft);border-color:transparent;color:var(--deal)}

nav{max-width:1600px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:9px 15px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--brand)}

/* ---------- layout ---------- */
.wrap{max-width:1600px;margin:0 auto;padding:18px 16px;display:grid;gap:18px;
  grid-template-columns:320px minmax(0,1fr)}
.wrap.full{grid-template-columns:minmax(0,1fr)}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
aside{padding:16px;align-self:start;position:sticky;top:104px;max-height:calc(100vh - 124px);overflow-y:auto}
@media(max-width:1000px){aside{position:static;max-height:none}}

/* ---------- kontrolki ---------- */
.fgroup{margin-bottom:18px}
.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.flabel .hint{color:var(--brand);text-transform:none;letter-spacing:0;font-weight:500}
.inp{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:9px;
  background:var(--panel-2);color:var(--text);font:inherit;font-size:14px;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);
  color:var(--text);font:inherit;font-size:13px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips.grow .chip{flex:1;text-align:center}
.check{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.scrollbox{max-height:170px;overflow-y:auto;padding-right:4px;margin-top:7px}
.tiny{font-size:11px;color:var(--faint);margin:5px 0 0}

.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--brand)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.outline{border-color:var(--brand);color:var(--brand);background:transparent}
.btn.danger{border-color:var(--deal);color:var(--deal);background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}

/* pasek narzędzi nad listą ofert */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sortwrap{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.sortwrap span{white-space:nowrap}
.inp.sm{width:auto;padding:6px 9px;font-size:13px;cursor:pointer}
@media(max-width:520px){
  .toolbar{width:100%}
  .sortwrap{flex:1}
  .inp.sm{flex:1;width:100%}
}

/* ---------- karty ofert ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:4/3;background:var(--panel-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .noimg{width:100%;height:100%;display:grid;place-items:center;color:var(--faint);font-size:13px}
.thumb .tags{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
.starbtn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;
  background:rgba(255,255,255,.92);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
html[data-theme="dark"] .starbtn{background:rgba(17,24,39,.92)}
.cbody{padding:13px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.ctitle{font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.ctitle:hover{color:var(--brand)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.price span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.specs{font-size:13.5px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.badge{padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:600;
  background:var(--panel-2);color:var(--muted);border:1px solid var(--border)}
.badge.deal{background:var(--deal-soft);color:var(--deal);border-color:transparent}
.badge.owner{background:var(--owner-soft);color:var(--owner);border-color:transparent}
.badge.market{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.badge.seller{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.badge.cond{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.cactions{display:flex;gap:8px;padding-top:6px}
.cactions .btn{flex:1;text-align:center}

/* ---------- listy / tabele ---------- */
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;background:var(--panel);
  border:1px solid var(--border);border-radius:11px;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--owner)} .dot.err{background:var(--deal)} .dot.off{background:var(--faint)}
.rowmain{flex:1;min-width:0}
.rowmain .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowmain .s{font-size:12.5px;color:var(--muted)}
.rowside{text-align:right;font-size:12px;color:var(--muted);flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;padding-bottom:6px}
td{padding:7px 12px 7px 0;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.section{padding:16px;margin-bottom:16px}
.section h3{margin:0 0 12px;font-size:15px}
.medians{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;font-size:13.5px}
.medians div{display:flex;justify-content:space-between;padding:5px 9px;border-radius:8px;background:var(--panel-2)}
.empty{text-align:center;color:var(--muted);padding:70px 20px;grid-column:1/-1}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.6);padding:16px;overflow-y:auto;display:none}
#modal.show{display:block}
.modalbox{max-width:660px;margin:36px auto;background:var(--panel);border-radius:18px;padding:20px}
.modalbox img{width:100%;border-radius:12px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px;margin-bottom:14px}
.kv .k{color:var(--muted)}
.note{padding:10px 12px;border-radius:10px;background:var(--panel-2);font-size:13.5px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;
  background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;
  box-shadow:var(--shadow);display:none;max-width:90vw}
.hidden{display:none !important}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">W</div>
    <div style="margin-right:auto">
      <h1>Monitor mieszkań — Wrocław</h1>
      <p class="sub" id="subtitle">ładowanie…</p>
    </div>
    <div class="pills" id="statPills"></div>
    <button class="btn primary" id="btnScrape">⟳ Odśwież oferty</button>
    <button class="btn" id="btnTheme" title="Zmień motyw">🌗</button>
  </div>
  <nav>
    <button class="tab active" data-tab="offers">Oferty</button>
    <button class="tab" data-tab="favs">Ulubione</button>
    <button class="tab" data-tab="alerts">Powiadomienia</button>
    <button class="tab" data-tab="filters">Moje alerty</button>
    <button class="tab" data-tab="health">Źródła</button>
  </nav>
</header>

<div class="wrap" id="wrap">

  <!-- ======================= PANEL FILTRÓW ======================= -->
  <aside class="panel" id="filterPanel">
    <div class="spread" style="margin-bottom:16px">
      <b>Filtry zakupu</b>
      <button class="btn sm" id="btnReset">wyczyść</button>
    </div>

    <div class="fgroup">
      <label class="flabel">Cena całkowita (zł)</label>
      <div class="two"><input id="price_min" class="inp" type="number" placeholder="od">
                       <input id="price_max" class="inp" type="number" placeholder="do"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Cena za m² (zł) <span class="hint">← kluczowe przy zakupie</span></label>
      <div class="two"><input id="ppm_min" class="inp" type="number" placeholder="od">
                       <input id="ppm_max" class="inp" type="number" placeholder="do"></div>
      <p class="tiny" id="ppmHint"></p>
    </div>

    <div class="fgroup">
      <label class="flabel">Metraż (m²)</label>
      <div class="two"><input id="area_min" class="inp" type="number" placeholder="od">
                       <input id="area_max" class="inp" type="number" placeholder="do"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Liczba pokoi</label>
      <div class="chips grow" id="roomsBox"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Rynek</label>
      <div class="chips grow" id="marketBox"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Typ sprzedawcy</label>
      <div id="sellerBox"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Rejon Wrocławia</label>
      <div class="chips" id="regionBox"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Osiedla <span class="hint" style="color:var(--faint)">(można kilka)</span></label>
      <input id="estateSearch" class="inp" placeholder="szukaj osiedla…">
      <div class="chips scrollbox" id="estateBox"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Stan nieruchomości</label>
      <div id="conditionBox"></div>
    </div>

    <div class="fgroup">
      <label class="flabel">Słowa kluczowe</label>
      <input id="kw_include" class="inp" placeholder="muszą wystąpić: balkon, winda" style="margin-bottom:6px">
      <input id="kw_any" class="inp" placeholder="dowolne z: garaż, postojowe" style="margin-bottom:6px">
      <input id="kw_exclude" class="inp" placeholder="wykluczone: prowizja, poddasze">
      <p class="tiny">rozdziel przecinkami</p>
    </div>

    <div class="fgroup">
      <label class="check"><input type="checkbox" id="only_deals"> Tylko okazje cenowe</label>
      <label class="check"><input type="checkbox" id="hide_duplicates" checked> Ukryj duplikaty ofert</label>
    </div>

    <div class="two">
      <button class="btn primary" id="btnSearch">Szukaj</button>
      <button class="btn outline" id="btnSaveFilter">🔔 Alert</button>
    </div>
  </aside>

  <!-- ======================= TREŚĆ ======================= -->
  <main>
    <section id="tab-offers">
      <div class="spread">
        <span class="sub" id="resultCount">—</span>
        <div class="toolbar">
          <label class="sortwrap">
            <span>Sortuj</span>
            <select id="sort" class="inp sm">
              <option value="newest">Najnowsze</option>
              <option value="deal">Największa okazja</option>
              <option value="ppm_asc">Cena za m² — od najniższej</option>
              <option value="price_asc">Cena — od najniższej</option>
              <option value="price_desc">Cena — od najwyższej</option>
              <option value="area_desc">Metraż — od największego</option>
            </select>
          </label>
          <button class="btn sm" id="btnManual">＋ Wklej ofertę z FB / forum</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div style="text-align:center;margin-top:22px">
        <button class="btn hidden" id="btnMore">Pokaż więcej</button>
      </div>
    </section>

    <section id="tab-favs" class="hidden"><div class="grid" id="favGrid"></div></section>
    <section id="tab-alerts" class="hidden"></section>
    <section id="tab-filters" class="hidden"></section>
    <section id="tab-health" class="hidden"></section>
  </main>
</div>

<div id="toast"></div>
<div id="modal"><div class="modalbox" id="modalBody"></div></div>

<script>
// =====================================================================
//  Stan + helpery
// =====================================================================
const state = { meta:null, criteria:{}, offset:0, limit:60, total:0, items:[], favorites:new Set() };
const SEL = { rooms:new Set(), regions:new Set(), estates:new Set(), seller:new Set(), conditions:new Set(), market:'oba' };

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pln = v => v == null ? '—' : new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(v)+' zł';
const m2  = v => v == null ? '—' : v.toFixed(1).replace('.',',')+' m²';

async function api(path, opts={}){
  const res = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  if(!res.ok) throw new Error((await res.text()).slice(0,200));
  return res.json();
}
let toastTimer;
function toast(msg, ms=3200){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none', ms);
}

const SOURCE_LABELS = {olx:'OLX', otodom:'Otodom', nieruchomosci_online:'Nieruchomości-online',
  morizon:'Morizon', gratka:'Gratka', sprzedawacz:'Sprzedawacz', adradar:'Adradar',
  manual:'Import ręczny', facebook_group:'Facebook'};
const MARKET_LABELS = {pierwotny:'rynek pierwotny', wtorny:'rynek wtórny'};
const SELLER_LABELS = {wlasciciel:'właściciel', biuro:'biuro', deweloper:'deweloper'};
const COND_LABELS = {do_zamieszkania:'do zamieszkania', do_remontu:'do remontu',
  stan_deweloperski:'stan deweloperski', nieokreslony:''};
const srcLabel = s => SOURCE_LABELS[s] || (s.startsWith('dev:') ? 'Deweloper' : s);

// =====================================================================
//  Motyw
// =====================================================================
document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
$('btnTheme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
};

// =====================================================================
//  Panel filtrów
// =====================================================================
function buildFilters(){
  $('roomsBox').innerHTML = [1,2,3,4,5].map(n =>
    `<button class="chip${SEL.rooms.has(n)?' on':''}" data-room="${n}">${n}${n===5?'+':''}</button>`).join('');
  $('roomsBox').onclick = e => {
    const b = e.target.closest('[data-room]'); if(!b) return;
    const n = +b.dataset.room;
    SEL.rooms.has(n) ? SEL.rooms.delete(n) : SEL.rooms.add(n);
    b.classList.toggle('on');
  };

  $('marketBox').innerHTML = [['oba','Oba'],['pierwotny','Pierwotny'],['wtorny','Wtórny']]
    .map(([v,l]) => `<button class="chip${SEL.market===v?' on':''}" data-market="${v}">${l}</button>`).join('');
  $('marketBox').onclick = e => {
    const b = e.target.closest('[data-market]'); if(!b) return;
    SEL.market = b.dataset.market;
    [...$('marketBox').children].forEach(c => c.classList.toggle('on', c === b));
  };

  $('sellerBox').innerHTML = state.meta.seller_types.map(s =>
    `<label class="check"><input type="checkbox" data-seller="${s.value}"${SEL.seller.has(s.value)?' checked':''}> ${esc(s.label)}</label>`).join('');
  $('sellerBox').onchange = e => {
    const v = e.target.dataset.seller;
    e.target.checked ? SEL.seller.add(v) : SEL.seller.delete(v);
  };

  $('conditionBox').innerHTML = state.meta.conditions.map(c =>
    `<label class="check"><input type="checkbox" data-cond="${c.value}"${SEL.conditions.has(c.value)?' checked':''}> ${esc(c.label)}</label>`).join('');
  $('conditionBox').onchange = e => {
    const v = e.target.dataset.cond;
    e.target.checked ? SEL.conditions.add(v) : SEL.conditions.delete(v);
  };

  $('regionBox').innerHTML = state.meta.regions.map(r =>
    `<button class="chip${SEL.regions.has(r)?' on':''}" data-region="${esc(r)}">${esc(r)}</button>`).join('');
  $('regionBox').onclick = e => {
    const b = e.target.closest('[data-region]'); if(!b) return;
    const r = b.dataset.region;
    SEL.regions.has(r) ? SEL.regions.delete(r) : SEL.regions.add(r);
    b.classList.toggle('on');
  };

  renderEstates($('estateSearch').value || '');
}

function renderEstates(query){
  const q = query.toLowerCase();
  const list = state.meta.estates.filter(e => e.toLowerCase().includes(q)).slice(0,80);
  $('estateBox').innerHTML = list.map(e =>
    `<button class="chip${SEL.estates.has(e)?' on':''}" data-estate="${esc(e)}">${esc(e)}</button>`).join('');
}
$('estateSearch').oninput = e => renderEstates(e.target.value);
$('estateBox').onclick = e => {
  const b = e.target.closest('[data-estate]'); if(!b) return;
  const v = b.dataset.estate;
  SEL.estates.has(v) ? SEL.estates.delete(v) : SEL.estates.add(v);
  b.classList.toggle('on');
};

const splitKw = v => v.split(',').map(s => s.trim()).filter(Boolean);
const numOf = id => $(id).value === '' ? null : Number($(id).value);

function readCriteria(){
  return {
    price_min:numOf('price_min'), price_max:numOf('price_max'),
    ppm_min:numOf('ppm_min'),     ppm_max:numOf('ppm_max'),
    area_min:numOf('area_min'),   area_max:numOf('area_max'),
    rooms:[...SEL.rooms], market:SEL.market,
    seller_types:[...SEL.seller], regions:[...SEL.regions],
    estates:[...SEL.estates], conditions:[...SEL.conditions],
    keywords_include:splitKw($('kw_include').value),
    keywords_any:splitKw($('kw_any').value),
    keywords_exclude:splitKw($('kw_exclude').value),
    only_deals:$('only_deals').checked,
    hide_duplicates:$('hide_duplicates').checked,
    only_active:true, sort:$('sort').value,
  };
}

function applyCriteria(c){
  c = c || {};
  ['price_min','price_max','ppm_min','ppm_max','area_min','area_max'].forEach(k => $(k).value = c[k] ?? '');
  $('kw_include').value = (c.keywords_include||[]).join(', ');
  $('kw_any').value = (c.keywords_any||[]).join(', ');
  $('kw_exclude').value = (c.keywords_exclude||[]).join(', ');
  $('only_deals').checked = !!c.only_deals;
  $('hide_duplicates').checked = c.hide_duplicates !== false;
  $('sort').value = c.sort || 'newest';
  SEL.rooms = new Set(c.rooms||[]);          SEL.regions = new Set(c.regions||[]);
  SEL.estates = new Set(c.estates||[]);      SEL.seller = new Set(c.seller_types||[]);
  SEL.conditions = new Set(c.conditions||[]); SEL.market = c.market || 'oba';
  buildFilters();
  search();
}

// =====================================================================
//  Karta oferty
// =====================================================================
function imgFallback(img){
  const ph = document.createElement('div');
  ph.className = 'noimg';
  ph.textContent = 'bez zdjęcia';
  img.replaceWith(ph);
}

function card(l){
  const fav = state.favorites.has(l.id);
  const tags = [];
  if (l.is_deal) tags.push(`<span class="badge deal">okazja −${Math.round(l.deal_score)}%</span>`);
  if (l.seller_type === 'wlasciciel') tags.push('<span class="badge owner">bezpośrednio</span>');

  // uwaga: przy błędzie ładowania podmieniamy TYLKO <img>, nie całą miniaturę —
  // inaczej zniknęłyby przyciski (ulubione) i plakietki
  const thumb = l.image_url
    ? `<img src="${esc(l.image_url)}" loading="lazy" alt="" onerror="imgFallback(this)">`
    : `<div class="noimg">bez zdjęcia</div>`;

  return `<article class="card">
    <div class="thumb">${thumb}
      <div class="tags">${tags.join('')}</div>
      <button class="starbtn" data-fav="${l.id}" title="Ulubione">${fav?'⭐':'☆'}</button>
    </div>
    <div class="cbody">
      <a class="ctitle" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>
      <div class="price"><b>${pln(l.price)}</b><span>${pln(l.price_per_m2)}/m²</span></div>
      <div class="specs">${m2(l.area)} · ${l.rooms ? l.rooms+' pok.' : '— pok.'}${
        l.floor != null ? ' · ' + (l.floor === 0 ? 'parter' : l.floor+' piętro') : ''}</div>
      <div class="specs">📍 ${esc(l.estate || l.region || l.location_raw || 'Wrocław')}</div>
      <div class="badges">
        <span class="badge">${esc(srcLabel(l.source))}</span>
        ${l.market ? `<span class="badge market">${MARKET_LABELS[l.market]}</span>` : ''}
        ${l.seller_type ? `<span class="badge seller">${SELLER_LABELS[l.seller_type]}</span>` : ''}
        ${l.condition && COND_LABELS[l.condition] ? `<span class="badge cond">${COND_LABELS[l.condition]}</span>` : ''}
      </div>
      <div class="cactions">
        <a class="btn primary" href="${esc(l.url)}" target="_blank" rel="noopener">Otwórz</a>
        <button class="btn" data-detail="${l.id}">Szczegóły</button>
      </div>
    </div>
  </article>`;
}

// =====================================================================
//  Wyszukiwanie
// =====================================================================
async function search(reset=true){
  if(reset){ state.offset = 0; state.items = []; }
  state.criteria = readCriteria();
  const data = await api('/api/search', {method:'POST', body:JSON.stringify(
    {criteria:state.criteria, limit:state.limit, offset:state.offset})});
  state.total = data.total;
  state.items = reset ? data.items : state.items.concat(data.items);
  $('grid').innerHTML = state.items.map(card).join('') ||
    `<p class="empty">Brak ofert spełniających kryteria.<br><small>Rozluźnij filtry albo kliknij „Odśwież oferty”.</small></p>`;
  $('resultCount').textContent = `${data.total} ofert · pokazano ${state.items.length}`;
  $('btnMore').classList.toggle('hidden', state.items.length >= data.total);
}

// =====================================================================
//  Zakładki
// =====================================================================
document.querySelectorAll('.tab').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
  ['offers','favs','alerts','filters','health'].forEach(t =>
    $('tab-'+t).classList.toggle('hidden', t !== btn.dataset.tab));
  const onOffers = btn.dataset.tab === 'offers';
  $('filterPanel').classList.toggle('hidden', !onOffers);
  document.querySelector('.wrap').classList.toggle('full', !onOffers);
  ({favs:loadFavorites, alerts:loadAlerts, filters:loadFilters, health:loadHealth}[btn.dataset.tab]||(()=>{}))();
});

async function loadFavorites(){
  const items = await api('/api/favorites');
  $('favGrid').innerHTML = items.map(card).join('') ||
    `<p class="empty">Nic tu jeszcze nie ma — kliknij ☆ na karcie oferty.</p>`;
}

async function loadAlerts(){
  const items = await api('/api/notifications');
  $('tab-alerts').innerHTML = items.length ? items.map(n => {
    const l = n.listing || {};
    return `<div class="row">
      <span class="dot ${n.status==='sent'?'ok':(n.status==='failed'?'err':'off')}"></span>
      <div class="rowmain">
        <a class="t" href="${esc(l.url||'#')}" target="_blank">${esc(l.title||'—')}</a>
        <div class="s">${pln(l.price)} · ${pln(l.price_per_m2)}/m² · ${esc(l.estate||l.region||'')}</div>
      </div>
      <div class="rowside">
        <div>${esc(n.filter_name||'—')}</div>
        <div>${esc(n.channel)} · ${n.sent_at ? new Date(n.sent_at).toLocaleString('pl-PL') : ''}</div>
        ${n.error ? `<div style="color:var(--deal)">${esc(n.error.slice(0,60))}</div>` : ''}
      </div></div>`;
  }).join('') : `<p class="empty">Brak historii powiadomień.</p>`;
}

function describe(c){
  const p = [];
  if(c.price_min || c.price_max) p.push(`cena ${c.price_min?pln(c.price_min):'0'} – ${c.price_max?pln(c.price_max):'∞'}`);
  if(c.ppm_min || c.ppm_max) p.push(`za m² ${c.ppm_min||0}–${c.ppm_max||'∞'}`);
  if(c.area_min || c.area_max) p.push(`metraż ${c.area_min||0}–${c.area_max||'∞'} m²`);
  if(c.rooms?.length) p.push(`pokoje: ${c.rooms.join(', ')}`);
  if(c.market && c.market!=='oba') p.push(MARKET_LABELS[c.market]);
  if(c.seller_types?.length) p.push(c.seller_types.map(s=>SELLER_LABELS[s]).join(' / '));
  if(c.regions?.length) p.push(c.regions.join(', '));
  if(c.estates?.length) p.push(c.estates.join(', '));
  if(c.keywords_include?.length) p.push(`zawiera: ${c.keywords_include.join(', ')}`);
  if(c.keywords_exclude?.length) p.push(`bez: ${c.keywords_exclude.join(', ')}`);
  if(c.only_deals) p.push('tylko okazje');
  return p.join(' · ') || 'bez ograniczeń';
}

async function loadFilters(){
  const items = await api('/api/filters');
  const ch = state.meta.channels;
  $('tab-filters').innerHTML =
    `<div class="spread"><span class="sub">Kanały powiadomień — ${
      Object.entries(ch).map(([k,v])=>`${k}: ${v?'✅':'⛔'}`).join(' · ')}</span>
      <button class="btn sm" id="btnTestNotif">wyślij testowe powiadomienie</button></div>` +
    (items.length ? items.map(f => `
      <div class="row" style="align-items:flex-start">
        <span class="dot ${f.is_active?'ok':'off'}" style="margin-top:5px"></span>
        <div class="rowmain">
          <div class="t" style="white-space:normal">${esc(f.name)}</div>
          <div class="s" style="white-space:normal">${esc(describe(f.criteria))}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn sm" data-toggle="${f.id}">${f.is_active?'wyłącz':'włącz'}</button>
          <button class="btn sm" data-load="${f.id}">wczytaj</button>
          <button class="btn sm danger" data-del="${f.id}">usuń</button>
        </div>
      </div>`).join('')
    : `<p class="empty">Nie masz jeszcze alertów.<br><small>Ustaw filtry po lewej i kliknij „🔔 Alert”.</small></p>`);

  $('tab-filters').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Usunąć ten alert?')) return;
    await api('/api/filters/'+b.dataset.del, {method:'DELETE'}); loadFilters(); toast('Alert usunięty');
  });
  $('tab-filters').querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const f = items.find(x => x.id == b.dataset.toggle);
    await api('/api/filters/'+b.dataset.toggle, {method:'PATCH', body:JSON.stringify({is_active:!f.is_active})});
    loadFilters();
  });
  $('tab-filters').querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
    document.querySelector('[data-tab="offers"]').click();
    applyCriteria(items.find(x => x.id == b.dataset.load).criteria);
  });
  $('btnTestNotif').onclick = async () => {
    try { const r = await api('/api/notifications/test',{method:'POST'});
      toast('Test: ' + Object.entries(r.results).map(([k,v])=>`${k}=${v}`).join(', '), 6000);
    } catch(e){ toast('Błąd: '+e.message, 6000); }
  };
}

async function loadHealth(){
  const s = await api('/api/stats');
  const rows = s.last_runs.map(r => `<tr>
    <td>${esc(srcLabel(r.source))}</td><td>${r.status==='ok'?'✅':'❌'}</td>
    <td>${r.found}</td><td style="color:var(--owner)">+${r.new}</td><td>${r.duplicates}</td>
    <td style="color:var(--muted)">${r.started_at ? new Date(r.started_at).toLocaleString('pl-PL') : ''}</td>
    </tr>`).join('');

  $('tab-health').innerHTML = `
    <div class="panel section">
      <h3>Oferty według źródła</h3>
      <div class="chips">${s.by_source.map(b =>
        `<span class="chip" style="cursor:default">${esc(srcLabel(b.source))} <b>${b.count}</b></span>`).join('')
        || '<span class="sub">brak danych</span>'}</div>
    </div>
    <div class="panel section">
      <div class="spread"><h3 style="margin:0">Ostatnie przebiegi scrapowania</h3>
        <button class="btn sm" id="btnRebuild">przelicz deduplikację i mediany</button></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Źródło</th><th>Status</th><th>Znaleziono</th><th>Nowe</th><th>Dupl.</th><th>Kiedy</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" style="color:var(--muted)">brak przebiegów</td></tr>'}</tbody>
      </table></div>
    </div>
    <div class="panel section">
      <h3>Mediany cen za m² — osiedla</h3>
      <div class="medians">${s.market.estates.map(e =>
        `<div><span>${esc(e.name)}</span><span>${pln(e.median_price_per_m2)}
         <small style="color:var(--faint)">(${e.sample_size})</small></span></div>`).join('')
        || '<span class="sub">za mało danych do policzenia median</span>'}</div>
    </div>`;

  $('btnRebuild').onclick = async () => {
    toast('Przeliczam…', 10000);
    const r = await api('/api/rebuild', {method:'POST'});
    toast(`Gotowe: ${r.duplicates} duplikatów, ${r.deals} okazji`);
    loadHealth(); refreshStats();
  };
}

// =====================================================================
//  Akcje globalne
// =====================================================================
document.body.addEventListener('click', async e => {
  const favBtn = e.target.closest('[data-fav]');
  if(favBtn){
    const id = +favBtn.dataset.fav;
    try{
      if(state.favorites.has(id)){
        await api('/api/favorites/'+id, {method:'DELETE'});
        state.favorites.delete(id); favBtn.textContent = '☆';
      } else {
        await api('/api/favorites', {method:'POST', body:JSON.stringify({listing_id:id, note:''})});
        state.favorites.add(id); favBtn.textContent = '⭐';
      }
    } catch(err){ toast('Błąd: '+err.message); }
    return;
  }
  const det = e.target.closest('[data-detail]');
  if(det) showDetail(+det.dataset.detail);
});

async function showDetail(id){
  const l = await api('/api/listings/'+id);
  const hist = (l.price_history||[]).map(h =>
    `<li>${new Date(h.date).toLocaleDateString('pl-PL')} — ${pln(h.price)}</li>`).join('');
  const dups = (l.duplicates||[]).map(d =>
    `<li><a href="${esc(d.url)}" target="_blank" style="color:var(--brand)">${esc(srcLabel(d.source))} — ${pln(d.price)}</a></li>`).join('');

  $('modalBody').innerHTML = `
    <div class="spread"><b style="font-size:17px">${esc(l.title)}</b>
      <button class="btn sm" onclick="document.getElementById('modal').classList.remove('show')">✕</button></div>
    ${l.image_url ? `<img src="${esc(l.image_url)}" alt="">` : ''}
    <div class="kv">
      <div><span class="k">Cena:</span> <b>${pln(l.price)}</b></div>
      <div><span class="k">Za m²:</span> <b>${pln(l.price_per_m2)}</b></div>
      <div><span class="k">Metraż:</span> ${m2(l.area)}</div>
      <div><span class="k">Pokoje:</span> ${l.rooms ?? '—'}</div>
      <div><span class="k">Lokalizacja:</span> ${esc(l.location_raw||'')}</div>
      <div><span class="k">Źródło:</span> ${esc(srcLabel(l.source))}</div>
    </div>
    ${l.median_price_per_m2 ? `<div class="note">Mediana (${esc(l.median_source)}): <b>${pln(l.median_price_per_m2)}/m²</b>${
      l.deal_score != null ? ` → ta oferta jest <b style="color:${l.deal_score>0?'var(--owner)':'var(--deal)'}">${
        l.deal_score > 0 ? l.deal_score.toFixed(0)+'% poniżej' : Math.abs(l.deal_score).toFixed(0)+'% powyżej'}</b> mediany` : ''}</div>` : ''}
    ${dups ? `<div style="margin-bottom:14px"><b style="font-size:14px">Ta sama nieruchomość na innych portalach</b>
      <ul style="margin:6px 0;padding-left:20px;font-size:14px">${dups}</ul></div>` : ''}
    ${hist.split('</li>').length > 2 ? `<div style="margin-bottom:14px"><b style="font-size:14px">Historia ceny</b>
      <ul style="margin:6px 0;padding-left:20px;font-size:14px">${hist}</ul></div>` : ''}
    <p style="font-size:14px;color:var(--muted);white-space:pre-line">${esc(l.description)}</p>
    <a class="btn primary" style="display:inline-block;margin-top:12px" href="${esc(l.url)}" target="_blank">Otwórz ogłoszenie</a>`;
  $('modal').classList.add('show');
}
$('modal').onclick = e => { if(e.target.id === 'modal') $('modal').classList.remove('show'); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') $('modal').classList.remove('show'); });

$('btnSearch').onclick = () => search();
// zmiana sortowania działa od razu — nikt nie powinien szukać przycisku „Szukaj”
$('sort').onchange = () => search();
$('btnMore').onclick = () => { state.offset += state.limit; search(false); };
$('btnReset').onclick = () => applyCriteria({});
$('btnScrape').onclick = async () => {
  const b = $('btnScrape'); b.disabled = true; b.textContent = '⏳ Pobieram…';
  try{
    const r = await api('/api/scrape', {method:'POST', body:JSON.stringify({sources:[], send_alerts:true})});
    toast(`Nowych: ${r.new ?? 0} · zaktualizowanych: ${r.updated ?? 0} · alertów: ${r.alerts_sent ?? 0}`, 7000);
    await refreshStats(); await search();
  } catch(e){ toast('Błąd: '+e.message, 7000); }
  b.disabled = false; b.textContent = '⟳ Odśwież oferty';
};
$('btnSaveFilter').onclick = async () => {
  const name = prompt('Nazwa alertu (np. „2–3 pok. Krzyki do 800 tys.”)');
  if(!name) return;
  await api('/api/filters', {method:'POST', body:JSON.stringify({name, criteria:readCriteria()})});
  toast('Alert zapisany — dostaniesz powiadomienie o nowych pasujących ofertach');
};
$('btnManual').onclick = async () => {
  const text = prompt('Wklej treść ogłoszenia (np. post z grupy na Facebooku):');
  if(!text) return;
  const url = prompt('Link do ogłoszenia (opcjonalnie):') || '';
  try{
    const r = await api('/api/manual-listing', {method:'POST', body:JSON.stringify({text, url})});
    toast(r.created ? 'Dodano ofertę do bazy' : 'Ta oferta już była w bazie');
    search();
  } catch(e){ toast('Nie udało się sparsować: '+e.message, 6000); }
};

// =====================================================================
//  Start
// =====================================================================
async function refreshStats(){
  const s = await api('/api/stats');
  $('statPills').innerHTML = `
    <span class="pill">Aktywne: <b>${s.unique}</b></span>
    <span class="pill deal">Okazje: <b>${s.deals}</b></span>
    <span class="pill">Duplikaty: <b>${s.duplicates}</b></span>`;
  const med = s.market.city_median_price_per_m2;
  $('subtitle').textContent = med
    ? `mediana miasta ${pln(med)}/m² · ${s.active} aktywnych ogłoszeń`
    : `${s.active} ogłoszeń w bazie`;
  if(med) $('ppmHint').textContent = `Mediana dla Wrocławia: ${pln(med)}/m²`;
}

(async function init(){
  try{
    state.meta = await api('/api/meta');
    buildFilters();
    state.favorites = new Set((await api('/api/favorites')).map(f => f.id));
    await refreshStats();
    await search();
    const id = new URLSearchParams(location.search).get('listing');
    if(id) showDetail(+id);
  } catch(e){
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="padding:14px;background:var(--deal-soft);color:var(--deal)">
         Nie mogę połączyć się z API: ${esc(e.message)}</div>`);
  }
})();
</script>
