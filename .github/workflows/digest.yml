name: Podsumowanie dnia

# Codzienny przegląd tego, co przybyło — jedna wiadomość na Telegramie zamiast
# przeglądania dashboardu. Alerty na bieżąco to osobny workflow (scrape.yml).
#
# Cron liczy się w UTC. Polska latem to UTC+2, zimą UTC+1, więc godziny
# wysyłki przesuną się o godzinę po zmianie czasu — nic się nie psuje,
# ale jeśli chcesz to wyrównać, przestaw wartości poniżej.
on:
  schedule:
    - cron: "0 6 * * *"     # 08:00 czasu polskiego (latem)
    - cron: "0 17 * * *"    # 19:00 czasu polskiego (latem)
  workflow_dispatch:
    inputs:
      hours:
        description: "Za ile ostatnich godzin podsumować"
        required: false
        default: "24"
      limit:
        description: "Ile ofert wypisać"
        required: false
        default: "8"

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCHEDULER_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Sprawdź konfigurację
        run: |
          BRAK=""
          [ -z "$DATABASE_URL" ]       && BRAK="$BRAK DATABASE_URL"
          [ -z "$TELEGRAM_BOT_TOKEN" ] && BRAK="$BRAK TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ]   && BRAK="$BRAK TELEGRAM_CHAT_ID"
          if [ -n "$BRAK" ]; then
            echo "::error::Brakuje sekretow:$BRAK"
            echo ""
            echo "Dodaj je na GitHubie: Settings -> Secrets and variables -> Actions"
            echo "-> zakladka Secrets -> New repository secret."
            echo "Nazwy musza sie zgadzac co do znaku, wielkimi literami."
            exit 1
          fi
          echo "Sekrety na miejscu."
          echo "  DATABASE_URL: ${#DATABASE_URL} znakow"
          echo "  TELEGRAM_CHAT_ID: $TELEGRAM_CHAT_ID"
          case "$DATABASE_URL" in
            postgresql*) echo "  Baza: PostgreSQL - OK" ;;
            *) echo "::warning::DATABASE_URL nie wyglada na adres PostgreSQL" ;;
          esac

      - name: Wyślij podsumowanie
        run: |
          python -m app.tools.digest \
            --hours "${{ github.event.inputs.hours || '24' }}" \
            --limit "${{ github.event.inputs.limit || '8' }}"
