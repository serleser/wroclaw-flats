name: Scrapowanie ofert

# Cron w UTC. */30 = co pół godziny.
# Uwaga: GitHub czasem opóźnia zaplanowane uruchomienia o kilka–kilkanaście minut
# przy dużym obciążeniu — to normalne i nie psuje działania alertów.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:            # przycisk "Run workflow" do ręcznego odpalenia
    inputs:
      sources:
        description: "Źródła po przecinku (puste = z ENABLED_SOURCES)"
        required: false
        default: ""
      send_alerts:
        description: "Wysyłać powiadomienia?"
        type: boolean
        default: true

# Nie pozwól dwóm przebiegom nachodzić na siebie (zduplikowane alerty).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ENABLED_SOURCES: ${{ vars.ENABLED_SOURCES || 'olx,otodom,nieruchomosci_online,morizon' }}
      MAX_PAGES_PER_SOURCE: ${{ vars.MAX_PAGES_PER_SOURCE || '3' }}
      MAX_NOTIFICATIONS_PER_RUN: ${{ vars.MAX_NOTIFICATIONS_PER_RUN || '15' }}
      SILENT_FIRST_RUN: ${{ vars.SILENT_FIRST_RUN || '1' }}
      SCHEDULER_ENABLED: "0"
      REQUEST_DELAY_MIN: "2.0"
      REQUEST_DELAY_MAX: "5.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Sprawdź konfigurację
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Brak sekretu DATABASE_URL (connection string z Neona)"
            exit 1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Brak TELEGRAM_BOT_TOKEN — alerty nie zostaną wysłane"
          fi

      - name: Cykl scrapowania
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            ARGS="--sources ${{ github.event.inputs.sources }}"
          fi
          if [ "${{ github.event.inputs.send_alerts }}" = "false" ]; then
            ARGS="$ARGS --no-alerts"
          fi
          python -m app.tools.run_once $ARGS | tee summary.json

      - name: Podsumowanie w zakładce Actions
        if: always()
        run: |
          echo "## Wynik scrapowania" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat summary.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "brak danych"
          echo '```' >> $GITHUB_STEP_SUMMARY
